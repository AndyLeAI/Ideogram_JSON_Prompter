<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Prompt Generation Tool</title>
    <style>
        :root {
            --bg-color: #070b16;
            --bg-soft: #0e1424;
            --panel-bg: rgba(18, 24, 42, 0.92);
            --panel-bg-2: rgba(12, 18, 32, 0.92);
            --border: rgba(130, 145, 190, 0.22);
            --border-strong: rgba(139, 124, 255, 0.46);
            --primary: #7c5cff;
            --primary-2: #22d3ee;
            --danger: #ff477e;
            --success: #20d695;
            --text: #eef2ff;
            --muted: #a9b3cf;
            --input-bg: #070c1a;
            --shadow: 0 20px 70px rgba(0,0,0,.38);
        }

        * { box-sizing: border-box; }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at 15% -10%, rgba(124,92,255,.25), transparent 34%),
                radial-gradient(circle at 92% 8%, rgba(34,211,238,.14), transparent 28%),
                linear-gradient(180deg, #080b16 0%, #050813 100%);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-controls,
        .panel,
        .canvas-shell,
        .tool-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .header-controls {
            padding: 16px;
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }

        .main-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(340px, 430px);
            gap: 16px;
            align-items: flex-start;
        }

        .left-col, .right-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .panel { padding: 16px; }

        .panel h3 {
            margin: 0 0 14px;
            font-size: 14px;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #dbe3ff;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .input-group { margin-bottom: 12px; }

        label, .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .04em;
            color: #c8d0eb;
            margin-bottom: 6px;
        }

        .hint { color: var(--muted); font-size: 13px; line-height: 1.45; }

        input[type="text"], textarea, select {
            width: 100%;
            color: var(--text);
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 11px 12px;
            outline: none;
            transition: border-color .18s, box-shadow .18s, background .18s;
        }

        textarea { min-height: 88px; resize: vertical; }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 4px rgba(124,92,255,.16);
        }

        input[type="range"] { width: 100%; accent-color: var(--primary); }

        .control-block { min-width: 260px; flex: 1; }
        .aspect-block { min-width: 310px; flex: 1.1; }
        .aspect-select {
            font-size: 18px;
            font-weight: 800;
            padding: 13px 15px;
            border-radius: 18px;
            background: #080d1c;
            border: 1px solid rgba(139,124,255,.55);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), 0 0 0 4px rgba(124,92,255,.10);
        }

        button {
            background: linear-gradient(135deg, var(--primary), #9a6bff);
            color: white;
            border: 0;
            padding: 11px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 900;
            letter-spacing: .01em;
            box-shadow: 0 12px 30px rgba(124,92,255,.28);
            transition: transform .15s, filter .15s;
        }

        button:hover { transform: translateY(-1px); filter: brightness(1.08); }
        button:active { transform: translateY(0); }

        .btn-success { background: linear-gradient(135deg, #17c987, #22d3ee); box-shadow: 0 12px 30px rgba(34,211,238,.18); }
        .btn-danger { background: linear-gradient(135deg, #ff477e, #ff2e63); box-shadow: 0 12px 30px rgba(255,71,126,.22); }

        .canvas-shell {
            width: 100%;
            padding: 18px;
            overflow: auto;
            max-height: 860px;
            min-height: 560px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            scrollbar-color: rgba(124,92,255,.65) rgba(10,15,28,.65);
            scrollbar-width: thin;
        }

        .canvas-shell::-webkit-scrollbar { width: 10px; height: 10px; }
        .canvas-shell::-webkit-scrollbar-track { background: rgba(10,15,28,.72); border-radius: 999px; }
        .canvas-shell::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #7c5cff, #22d3ee); border-radius: 999px; border: 2px solid rgba(10,15,28,.72); }
        .canvas-shell::-webkit-scrollbar-corner { background: rgba(10,15,28,.72); }

        #canvas-wrapper {
            background-color: #111827;
            background-image:
                linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px),
                url('example.png');
            background-size: 64px 64px, 64px 64px, cover;
            background-position: center, center, center;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 18px;
            position: relative;
            transform-origin: top left;
            overflow: hidden;
            user-select: none;
            touch-action: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 25px 80px rgba(0,0,0,.45);
            flex-shrink: 0;
            margin: 0 auto;
        }

        #canvas-wrapper::after {
            content: attr(data-size);
            position: absolute;
            left: 16px;
            top: 12px;
            color: rgba(238,242,255,.42);
            font-weight: 900;
            font-size: 18px;
            pointer-events: none;
        }

        .bounding-box {
            position: absolute;
            border: 2px solid #ff5b82;
            background: rgba(255, 91, 130, 0.16);
            cursor: grab;
            box-sizing: border-box;
            border-radius: 8px;
            box-shadow: 0 0 0 1px rgba(255,255,255,.16), 0 10px 28px rgba(0,0,0,.24);
        }

        .bounding-box.selected {
            border-color: #9b7cff;
            background: rgba(124, 92, 255, 0.18);
            z-index: 10;
            box-shadow:
                0 0 0 1px rgba(255,255,255,.22),
                0 0 0 4px rgba(124,92,255,.20),
                0 0 34px rgba(124,92,255,.55),
                0 10px 28px rgba(0,0,0,.28);
        }

        .box-label {
            position: absolute;
            left: 0;
            top: 0;
            max-width: 100%;
            height: 28px;
            line-height: 28px;
            padding: 0 10px;
            border-radius: 6px 0 8px 0;
            background: linear-gradient(90deg, rgba(255,91,130,.94), rgba(255,130,84,.88));
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            text-shadow: 0 1px 1px rgba(0,0,0,.25);
        }

        .bounding-box.selected .box-label { background: linear-gradient(90deg, rgba(34,211,238,.92), rgba(124,92,255,.88)); }

        .resize-handle {
            position: absolute;
            width: 13px;
            height: 13px;
            background: #ffffff;
            border: 2px solid #0f172a;
            right: -7px;
            bottom: -7px;
            cursor: nwse-resize;
            border-radius: 50%;
        }

        .color-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
        .swatch { width: 32px; height: 32px; border: 1px solid rgba(255,255,255,.35); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; color: transparent; transition: .2s; }
        .swatch:hover { color: #fff; text-shadow: 0 1px 3px #000; transform: translateY(-1px); }

        #json-output { width: 100%; height: 280px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 12px; }
        #image-view { max-height: 800px; object-fit: scale-down; border-radius: 18px; border: 1px solid var(--border); background: var(--panel-bg-2); }

        .pill-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .pill-group input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
        .pill-label { display: inline-block; padding: 8px 14px; background-color: #0a1020; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 800; }
        .pill-group input[type="radio"]:checked + .pill-label { background: linear-gradient(135deg, #2563eb, #7c5cff); color: white; border-color: transparent; }
        .pill-group p { margin: 0; color: var(--muted); font-weight: 800; }

        @media (max-width: 1050px) {
            .main-content { grid-template-columns: 1fr; }
            .right-col { width: 100%; }
        }
    </style>

</head>

<body>

    <div class="header-controls">
        <div class="aspect-block">
            <label>Aspect Ratio</label>
            <select id="aspect-ratio" class="aspect-select" onchange="applyAspectPreset()">
                <option value="original">Keep original image size</option>
                <option value="1024x1024" selected>1:1 — 1024×1024</option>
                <option value="1280x720">16:9 — 1280×720</option>
                <option value="720x1280">9:16 — 720×1280</option>
                <option value="1152x864">4:3 — 1152×864</option>
                <option value="864x1152">3:4 — 864×1152</option>
                <option value="1088x720">3:2 — 1088×720</option>
                <option value="720x1088">2:3 — 720×1088</option>
                <option value="1280x800">16:10 — 1280×800</option>
                <option value="800x1280">10:16 — 800×1280</option>
                <option value="1568x672">21:9 — 1568×672</option>
                <option value="720x1600">9:20 — 720×1600</option>
                <option value="custom">Custom — 1024×1024 (1:1)</option>
            </select>
        </div>
        <div class="control-block">
            <label>Width: <span id="w-val">1024</span></label>
            <input type="range" id="canvas-width" min="256" max="4096" step="16" value="1024">
        </div>
        <div class="control-block">
            <label>Height: <span id="h-val">1024</span></label>
            <input type="range" id="canvas-height" min="256" max="4096" step="16" value="1024">
        </div>
        <button onclick="initCanvas()">Go (Reset Canvas)</button>
    </div>

    <div class="main-content">
        <div class="left-col">
            <div class="hint">Click and drag on the canvas to create bounding boxes. Drag a PNG from ComfyUI to import its boxes and prompts.</div>
            <div class="canvas-shell">
                <div id="canvas-wrapper"></div>
            </div>

            <button class="btn-success" onclick="generateJSON()">Generate JSON Prompt</button>
            <textarea id="json-output" placeholder="JSON will appear here..."></textarea>
        <div>
            <label>Seed: <span id="r-seed-value">42</span></label>
            <input type="range" id="r-seed" min="1" max="99999" step="1" value="42">
        </div>
        <div>
            <label>Comfy API:</label>
            <input type="text" id="api-location" value="http://localhost:8188">
        </div>
            <button class="btn-success" onclick="generateImage()">Generate Image</button>
            <img id="image-view" style="max-height: 800px; object-fit: scale-down;">
        </div>

        <div class="right-col">
            <div class="panel">
                <h3>Global Settings</h3>
                <div class="pill-group">
                    <p style="margin: 0;">Mode:</p>
                    <input type="radio" id="mode_photo" name="art_mode" value="photo" onchange="setPhotoArtstyle(0)">
                    <label for="mode_photo" class="pill-label">photo</label>

                    <input type="radio" id="mode_artstyle" name="art_mode" value="art_style" checked onchange="setPhotoArtstyle(1)">
                    <label for="mode_artstyle" class="pill-label">art_style</label>
                </div>
                <br>
                <div class="input-group"><label>High Level Description</label><input type="text"
                        id="high_level_description"></div>
                <div class="input-group"><label>Aesthetics</label><input type="text" id="aesthetics"></div>
                <div class="input-group"><label>Lighting</label><input type="text" id="lighting"></div>
                <div class="input-group"><label>Medium</label><input type="text" id="medium"></div>
                <div class="input-group"><label id="mode_label">Art Style</label><input type="text" id="art_style"></div>
                <div class="input-group"><label>Background</label><textarea id="background"></textarea></div>
                <div class="input-group">
                    <label>Global Color Palette (Max 16)</label>
                    <input type="color" id="global-color-picker">
                    <button onclick="addColor('global')">Add</button>
                    <div id="global-colors" class="color-list"></div>
                </div>
            </div>

            <div class="panel" id="box-panel" style="display: none;">
                <h3>Selected Box Properties</h3>
                <div class="input-group">
                    <label>Mode</label>
                    <select id="box-mode" onchange="updateBoxData()" onkeypress = "this.onchange();" onpaste    = "this.onchange();" oninput    = "this.onchange();">
                        <option value="obj">Object (obj)</option>
                        <option value="text">Text (text)</option>
                    </select>
                </div>
                <div class="input-group" id="text-input-group" style="display: none;">
                    <label>Text Content</label>
                    <input type="text" id="box-text" onchange="updateBoxData()" onkeypress = "this.onchange();" onpaste    = "this.onchange();" oninput    = "this.onchange();">
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <textarea id="box-desc" onchange="updateBoxData()" onkeypress = "this.onchange();" onpaste    = "this.onchange();" oninput    = "this.onchange();"></textarea>
                </div>
                <div class="input-group">
                    <label>Box Color Palette (Max 5)</label>
                    <input type="color" id="box-color-picker">
                    <button onclick="addColor('box')">Add</button>
                    <div id="box-colors" class="color-list"></div>
                </div>
                <button class="btn-danger" onclick="deleteSelectedBox()" style="width: 100%; margin-top: 10px;">Delete Box</button>
            </div>
        </div>
    </div>

        // State

        // UI Listeners for sliders
        function syncSizeLabels() {
            document.getElementById('w-val').innerText = canvasWSlider.value.toString().padStart(4, '0');
            document.getElementById('h-val').innerText = canvasHSlider.value.toString().padStart(4, '0');

                aspectSelect.options[aspectSelect.selectedIndex].text = `Custom — ${canvasWSlider.value}×${canvasHSlider.value}`;
            }
        }

        canvasHSlider.addEventListener('input', () => { aspectSelect.value = 'custom'; syncSizeLabels(); });

        let defaultExampleImage = 'example.png';

            if (value === 'original') {
                setCanvasSize(defaultExampleSize.width, defaultExampleSize.height);

                const [w, h] = value.split('x').map(Number);
                setCanvasSize(w, h);
            }
            initCanvas();
        }

        function initCanvas() {
            canvasW = parseInt(canvasWSlider.value);
            canvasH = parseInt(canvasHSlider.value);
            canvas.style.width = canvasW + 'px';
            canvas.style.height = canvasH + 'px';

            fitCanvasToShell();

            canvas.dataset.size = `${canvasW} × ${canvasH}`;

            jsonOutput.value = '';
            boxes = [];

        function addColor(type) {
            const picker = document.getElementById(type + '-color-picker');
            let hex = picker.value.toUpperCase(); // Ideogram4 requires uppercase string

            if (type === 'global') {
                if (globalPalette.length >= 16) return alert("Max 16 colors allowed.");
                if (!globalPalette.includes(hex)) {
                    globalPalette.push(hex);
                    renderColors('global');
                }
            } else if (type === 'box' && selectedBoxId !== null) {
                const box = boxes.find(b => b.id === selectedBoxId);
                if (box.colors.length >= 5) return alert("Max 5 colors allowed per box.");
                if (!box.colors.includes(hex)) {
                    box.colors.push(hex);
                    renderColors('box');
                }
            }
        }

        function removeColor(type, hex) {
            if (type === 'global') {
                globalPalette = globalPalette.filter(c => c !== hex);
                renderColors('global');
            } else if (type === 'box' && selectedBoxId !== null) {
                const box = boxes.find(b => b.id === selectedBoxId);
                box.colors = box.colors.filter(c => c !== hex);
                renderColors('box');
            }
        }

        function renderColors(type) {
            const container = document.getElementById(type + '-colors');
            container.innerHTML = '';
            const list = type === 'global' ? globalPalette : (boxes.find(b => b.id === selectedBoxId)?.colors || []);

            list.forEach(hex => {
                const swatch = document.createElement('div');
                swatch.className = 'swatch';
                swatch.style.backgroundColor = hex;
                swatch.innerHTML = '×';
                swatch.onclick = () => removeColor(type, hex);
                container.appendChild(swatch);
            });
        }

        // Canvas Drawing Logic
        let isDrawing = false;
        let isDragging = false;
        let isResizing = false;
        let currentBoxDOM = null;
        let startX, startY;

        canvas.addEventListener('pointerdown', (e) => {
            if (e.target === canvas) {
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                startX = (e.clientX - rect.left) / scale;
                startY = (e.clientY - rect.top) / scale;

                const box = {
                    id: 'box_' + boxCounter++,
                    x: startX, y: startY, w: 0, h: 0,
                    mode: 'obj', text: '', desc: '', colors: []
                };
                boxes.push(box);

                currentBoxDOM = document.createElement('div');
                currentBoxDOM.className = 'bounding-box selected';
                currentBoxDOM.id = box.id;
                currentBoxDOM.style.left = startX + 'px';
                currentBoxDOM.style.top = startY + 'px';

                const handle = document.createElement('div');
                handle.className = 'resize-handle';
                appendBoxLabel(currentBoxDOM, box);
                currentBoxDOM.appendChild(handle);

                canvas.appendChild(currentBoxDOM);
                selectBox(box.id);
            } else if (e.target.classList.contains('resize-handle')) {
                isResizing = true;
                currentBoxDOM = e.target.parentElement;
                selectBox(currentBoxDOM.id);
                const rect = canvas.getBoundingClientRect();
                dragStartX = (e.clientX - rect.left) / scale;
                dragStartY = (e.clientY - rect.top) / scale;
                initialBoxW = parseFloat(currentBoxDOM.style.width);
                initialBoxH = parseFloat(currentBoxDOM.style.height);
                e.stopPropagation();
            } else if (e.target.closest('.bounding-box')) {
                isDragging = true;
                currentBoxDOM = e.target.closest('.bounding-box');
                selectBox(currentBoxDOM.id);
                const rect = canvas.getBoundingClientRect();
                dragStartX = (e.clientX - rect.left) / scale;
                dragStartY = (e.clientY - rect.top) / scale;
                initialBoxX = parseFloat(currentBoxDOM.style.left);
                initialBoxY = parseFloat(currentBoxDOM.style.top);
                e.stopPropagation();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const currentX = (e.clientX - rect.left) / scale;
            const currentY = (e.clientY - rect.top) / scale;

            if (isDrawing && currentBoxDOM) {
                const w = currentX - startX;
                const h = currentY - startY;
                currentBoxDOM.style.width = Math.abs(w) + 'px';
                currentBoxDOM.style.height = Math.abs(h) + 'px';
                currentBoxDOM.style.left = (w < 0 ? currentX : startX) + 'px';
                currentBoxDOM.style.top = (h < 0 ? currentY : startY) + 'px';
            }
        });

        window.addEventListener('pointerup', () => {
            if (isDrawing && currentBoxDOM) {
                // Save final dimensions
                const box = boxes.find(b => b.id === currentBoxDOM.id);
                box.w = parseFloat(currentBoxDOM.style.width) || 0;
                box.h = parseFloat(currentBoxDOM.style.height) || 0;
                box.x = parseFloat(currentBoxDOM.style.left) || 0;
                box.y = parseFloat(currentBoxDOM.style.top) || 0;

                if (box.w < 10 || box.h < 10) {
                    // Ignore tiny accidental clicks
                    canvas.removeChild(currentBoxDOM);
                    boxes = boxes.filter(b => b.id !== box.id);
                    selectBox(null);
                }
            }
            isDrawing = false;
            isDragging = false;
            isResizing = false;
            currentBoxDOM = null;
        });

        // Box Interaction (Select, Drag, Resize)
        let dragStartX, dragStartY, initialBoxX, initialBoxY, initialBoxW, initialBoxH;

        window.addEventListener('pointermove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const currentX = (e.clientX - rect.left) / scale;
            const currentY = (e.clientY - rect.top) / scale;

            if (isDragging && currentBoxDOM) {
                const dx = currentX - dragStartX;
                const dy = currentY - dragStartY;
                currentBoxDOM.style.left = (initialBoxX + dx) + 'px';
                currentBoxDOM.style.top = (initialBoxY + dy) + 'px';
            } else if (isResizing && currentBoxDOM) {
                const dx = currentX - dragStartX;
                const dy = currentY - dragStartY;
                currentBoxDOM.style.width = Math.max(10, initialBoxW + dx) + 'px';
                currentBoxDOM.style.height = Math.max(10, initialBoxH + dy) + 'px';
            }
        });

        // Box Forms logic
        function selectBox(id) {
            selectedBoxId = id;
            document.querySelectorAll('.bounding-box').forEach(el => el.classList.remove('selected'));
            if (id) {
                document.getElementById(id).classList.add('selected');
                boxPanel.style.display = 'block';

                const box = boxes.find(b => b.id === id);
                document.getElementById('box-mode').value = box.mode;
                document.getElementById('box-text').value = box.text;
                document.getElementById('box-desc').value = box.desc;
                document.getElementById('text-input-group').style.display = box.mode === 'text' ? 'block' : 'none';
                renderColors('box');
            } else {
                boxPanel.style.display = 'none';
            }
        }

        function updateBoxData() {
            if (!selectedBoxId) return;
            const box = boxes.find(b => b.id === selectedBoxId);
            box.mode = document.getElementById('box-mode').value;
            box.text = document.getElementById('box-text').value;
            box.desc = document.getElementById('box-desc').value;
            document.getElementById('text-input-group').style.display = box.mode === 'text' ? 'block' : 'none';
            updateBoxLabel(box);
        }

        function getBoxTitle(box) {
            const text = (box.mode === 'text' ? box.text : box.desc) || 'Describe this box...';
            return text.trim() || 'Describe this box...';
        }

        function appendBoxLabel(dom, box) {
            const label = document.createElement('div');
            label.className = 'box-label';
            dom.appendChild(label);
            updateBoxLabel(box);
        }

        function updateBoxLabel(box) {
            const dom = document.getElementById(box.id);
            if (!dom) return;
            let label = dom.querySelector('.box-label');
            if (!label) {
                label = document.createElement('div');
                label.className = 'box-label';
                dom.insertBefore(label, dom.firstChild);
            }
            label.textContent = getBoxTitle(box);
            label.title = getBoxTitle(box);
        }

        function setDefaultCanvasBackground() {
            const applyBg = (fileName, img) => {
                defaultExampleImage = fileName;
                if (img && img.naturalWidth && img.naturalHeight) {
                    defaultExampleSize = { width: img.naturalWidth, height: img.naturalHeight };
                }
                canvas.style.backgroundImage = `linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px), url('${fileName}')`;
                canvas.style.backgroundSize = '64px 64px, 64px 64px, cover';
                canvas.style.backgroundPosition = 'center, center, center';
                canvas.style.backgroundRepeat = 'repeat, repeat, no-repeat';
            };

            const png = new Image();
            png.onload = () => applyBg('example.png', png);
            png.onerror = () => {
                const jpg = new Image();
                jpg.onload = () => applyBg('example.jpg', jpg);
                jpg.onerror = () => {
                    canvas.style.backgroundImage = `linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px)`;
                    canvas.style.backgroundSize = '64px 64px, 64px 64px';
                };
                jpg.src = 'example.jpg';
            };
            png.src = 'example.png';
        }

        function fitCanvasToShell() {
            const shell = canvas.parentElement;
            const shellWidth = Math.max(320, shell.clientWidth - 40);
            const shellHeight = Math.max(320, shell.clientHeight - 40);

            // Auto fit when the canvas is larger than the visible workspace.
            // When it is smaller, keep it at 100% and center it with flex.
            scale = Math.min(shellWidth / canvasW, shellHeight / canvasH, 1);

            canvas.style.width = canvasW + 'px';
            canvas.style.height = canvasH + 'px';
            canvas.style.transform = 'none';
            canvas.style.zoom = scale;
            shell.style.width = '100%';
            shell.style.justifyContent = (canvasW * scale <= shellWidth) ? 'center' : 'flex-start';

            requestAnimationFrame(() => {
                if (shell.scrollWidth > shell.clientWidth) {
                    shell.scrollLeft = (shell.scrollWidth - shell.clientWidth) / 2;
                }
            });
        }

        window.addEventListener('resize', () => {
            fitCanvasToShell();
        });

        function deleteSelectedBox() {
            if (!selectedBoxId) return;
            const dom = document.getElementById(selectedBoxId);
            if (dom) dom.remove();
            boxes = boxes.filter(b => b.id !== selectedBoxId);
            selectBox(null);
        }

        // JSON Generation
        function generateJSON() {
            // Save current bounding box positions to state
            boxes.forEach(box => {
                const dom = document.getElementById(box.id);
                if (dom) {
                    box.x = parseFloat(dom.style.left);
                    box.y = parseFloat(dom.style.top);
                    box.w = parseFloat(dom.style.width);
                    box.h = parseFloat(dom.style.height);
                }
            });

            // Normalize Coordinates 0-1000
            const norm = (val, max) => Math.min(1000, Math.max(0, Math.round((val / max) * 1000)));

            const elements = boxes.map(box => {
                const x1 = norm(box.x, canvasW);
                const y1 = norm(box.y, canvasH);
                const x2 = norm(box.x + box.w, canvasW);
                const y2 = norm(box.y + box.h, canvasH);

                let el = {
                    type: box.mode,
                    bbox: [y1, x1, y2, x2],
                };

                if (box.mode === 'text') el.text = box.text;
                el.desc = box.desc;
                if (box.colors && box.colors.length > 0) el.color_palette = box.colors;

                return el;
            });

            var output = {
                high_level_description: document.getElementById('high_level_description').value,
                style_description: {
                    aesthetics: document.getElementById('aesthetics').value,
                    lighting: document.getElementById('lighting').value,
                    //medium: document.getElementById('medium').value,
                    //art_style: document.getElementById('art_style').value,
                    //color_palette: globalPalette
                },
                compositional_deconstruction: {
                    background: document.getElementById('background').value,
                    elements: elements
                }
            };

            // in photo mode, order in prompt should be "photo" then "medium",
            // while in art_style mode order should be "medium" then "art_style"
            if(photoArtStyleMode == MODE_PHOTO){
                output.style_description.photo = document.getElementById('art_style').value;
                output.style_description.medium = document.getElementById('medium').value;
            }
            else{
                output.style_description.medium = document.getElementById('medium').value;
                output.style_description.art_style = document.getElementById('art_style').value
            }

            output.style_description.color_palette = globalPalette

            jsonOutput.value = JSON.stringify(output, null, 2);
        }

        async function waitForComfyUIResult(
            promptId,
            serverUrl,
            pollInterval = 1000,
            timeout = 300000,
            fetchImages = true,
        ) {
            const startTime = Date.now();

            while (true) {
                if (Date.now() - startTime > timeout) {
                    throw new Error(`Timed out waiting for prompt ${promptId}`);
                }

                // Check prompt history
                const response = await fetch(
                    `${serverUrl}/history/${encodeURIComponent(promptId)}`
                );

                if (!response.ok) {
                    throw new Error(`Failed to fetch history: ${response.status}`);
                }

                const history = await response.json();

                // Prompt appears in history once execution completes
                if (history[promptId]) {
                    const outputs = history[promptId].outputs || {};

                    const results = [];

                    for (const nodeId of Object.keys(outputs)) {
                        const nodeOutput = outputs[nodeId];

                        if (!nodeOutput.images) continue;

                        for (const image of nodeOutput.images) {
                            const imageUrl =
                                `${serverUrl}/view?` +
                                new URLSearchParams({
                                    filename: image.filename,
                                    subfolder: image.subfolder || "",
                                    type: image.type || "output",
                                });

                            const result = {
                                nodeId,
                                imageUrl,
                                filename: image.filename,
                                subfolder: image.subfolder,
                                type: image.type,
                            };

                            if (fetchImages) {
                                const imgResp = await fetch(imageUrl);
                                result.blob = await imgResp.blob();
                            }

                            results.push(result);
                        }
                    }

                    return results;
                }

                await new Promise(resolve => setTimeout(resolve, pollInterval));
            }
        }

        function setImage(imgURL){
            document.getElementById("image-view").src = imgURL
            canvas.style.backgroundImage = `linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px), url("${imgURL}")`;
            canvas.style.backgroundSize = '64px 64px, 64px 64px, cover';
            canvas.style.backgroundPosition = 'center, center, center';
            fitCanvasToShell();
        }

        async function generateImage() {
            const api = document.getElementById("api-location").value
            json_prompt["98:24"]["inputs"]["text"] = jsonOutput.value
            json_prompt["98:27"]["inputs"]["value"] = canvasWSlider.value
            json_prompt["98:28"]["inputs"]["value"] = canvasHSlider.value
            json_prompt["98:18"]["inputs"]["noise_seed"] = seedSlider.value

            var req = await fetch(api+"/api/prompt", {
                "headers": {
                    "accept": "*/*",
                    "content-type": "application/json"
                },
                "body": JSON.stringify({ "prompt": json_prompt }),
                "method": "POST"
            });
            req = await req.json()
            const image = await waitForComfyUIResult(req.prompt_id, api,
                3000,
                300000,
                true
            )
            setImage(image[0].imageUrl)
        }

        function extractComfyUIMetadata(arrayBuffer) {
            const view = new DataView(arrayBuffer);

            // Check valid PNG 8-byte signature
            if (view.byteLength < 8 || view.getUint32(0) !== 0x89504E47 || view.getUint32(4) !== 0x0D0A1A0A) {
                throw new Error("Not a valid PNG file.");
            }

            let offset = 8;
            const result = {};

            while (offset < view.byteLength) {
                if (offset + 8 > view.byteLength) break;

                // Read chunk length and type
                const length = view.getUint32(offset);
                const chunkType = String.fromCharCode(
                    view.getUint8(offset + 4),
                    view.getUint8(offset + 5),
                    view.getUint8(offset + 6),
                    view.getUint8(offset + 7)
                );

                offset += 8; // Move past length and type

                if (chunkType === 'tEXt') {
                    if (offset + length > view.byteLength) break;

                    const chunkData = new Uint8Array(arrayBuffer, offset, length);
                    const nullByteIndex = chunkData.indexOf(0); // Keyword and text are separated by a 0x00 byte

                    if (nullByteIndex !== -1) {
                        const keyword = new TextDecoder('ascii').decode(chunkData.subarray(0, nullByteIndex));

                        if (keyword === 'prompt' || keyword === 'workflow') {
                            const rawText = new TextDecoder('utf-8').decode(chunkData.subarray(nullByteIndex + 1));
                            try {
                                result[keyword] = JSON.parse(rawText);
                            } catch (e) {
                                result[keyword] = rawText; // Fallback if JSON parsing fails
                            }
                        }
                    }
                }

                offset += length + 4; // Skip the data segment and the 4-byte CRC trailing checksum
            }
            for (const key of Object.keys(result.prompt)){
                try{
                    const json = JSON.parse(result.prompt[key].inputs.text)
                    if(json.hasOwnProperty("high_level_description")){
                        return json
                    }
                }
                catch(e){}
            }
        }

        function parseBoxesFromJSON(json){
            try{
                const n = json.compositional_deconstruction.elements.length
                for (var i=0; i<n; i++){
                    const element = json.compositional_deconstruction.elements[i]
                    const bbox = element.bbox
                    bbox[0] = bbox[0]/1000*canvasH
                    bbox[2] = bbox[2]/1000*canvasH
                    bbox[1] = bbox[1]/1000*canvasW
                    bbox[3] = bbox[3]/1000*canvasW
                    var box = {
                        id: 'box_' + boxCounter++,
                        x: bbox[1], y: bbox[0], w: bbox[3]-bbox[1], h: bbox[2]-bbox[0],
                        mode: element.type, text: element.text ?? '', desc: element.desc, colors: element.color_palette
                    }
                    boxes.push(box);

                    currentBoxDOM = document.createElement('div');
                    currentBoxDOM.className = 'bounding-box';
                    currentBoxDOM.id = box.id;
                    currentBoxDOM.style.left = box.x + 'px';
                    currentBoxDOM.style.top = box.y + 'px';
                    currentBoxDOM.style.width = box.w + 'px';
                    currentBoxDOM.style.height = box.h + 'px';

                    appendBoxLabel(currentBoxDOM, box);
                    const handle = document.createElement('div');
                    handle.className = 'resize-handle';
                    currentBoxDOM.appendChild(handle);

                    canvas.appendChild(currentBoxDOM);

                    currentBoxDOM = null;
                }
            }
            catch(e){
                alert("invalid JSON")
            }
        }
        function parseParametersFromJSON(json){
            document.getElementById('high_level_description').value = json.high_level_description
            document.getElementById('aesthetics').value = json.style_description.aesthetics
            document.getElementById('lighting').value = json.style_description.lighting
            document.getElementById('medium').value = json.style_description.medium
            document.getElementById('background').value = json.compositional_deconstruction.background
            const globalColorPicker = document.getElementById('global-color-picker')
            globalPalette = [];
            renderColors('global');
            for(var i=0; i<json.style_description.color_palette.length; i++){
                globalColorPicker.value = json.style_description.color_palette[i];
                addColor('global');
            }

            if(json.style_description.hasOwnProperty("photo")){
                document.getElementById('art_style').value = json.style_description.photo
                document.getElementById('mode_photo').checked = true
                setPhotoArtstyle(MODE_PHOTO);
            }
            else{
                document.getElementById('art_style').value = json.style_description.art_style
                document.getElementById('mode_artstyle').checked = true
                setPhotoArtstyle(MODE_ARTSTYLE);
            }
        }

        async function importImage(image){
            console.log(image.size)
            if(image.type.startsWith("image")){
                // is image
                const img = new Image();
                img.onload = function() {
                    canvasWSlider.value = this.width.toString();
                    canvasWSlider.dispatchEvent(new Event('input'));
                    canvasHSlider.value = this.height.toString();
                    canvasHSlider.dispatchEvent(new Event('input'));
                    defaultExampleSize = { width: this.width, height: this.height };
                    aspectSelect.value = 'original';
                    initCanvas();
                    setImage(img.src);

                    if(image.type=="image/png"){
                        // is png. try and find workflow metadata
                        image.arrayBuffer()
                        .then(buff => {
                            const json = extractComfyUIMetadata(buff);
                            jsonOutput.value = JSON.stringify(json, null, 2);
                            parseBoxesFromJSON(json)
                            parseParametersFromJSON(json)
                        })
                    }
                };
                img.src = URL.createObjectURL(image);
            }
            else{
                alert("images only")
            }
        }

        var photoArtStyleMode = 1;
        const MODE_PHOTO = 0;
        const MODE_ARTSTYLE = 1;
        function setPhotoArtstyle(mode){
            console.log(mode)
            photoArtStyleMode = mode
            if(mode==MODE_PHOTO){
                // photo mode
                document.getElementById("medium").value = "photograph";
                document.getElementById("medium").disabled = true
                document.getElementById("mode_label").innerText = "Photo"
            }
            else if (mode==MODE_ARTSTYLE){
                // art_style mode
                document.getElementById("medium").disabled = false
                document.getElementById("mode_label").innerText = "Art Style"
            }
            else{
                console.error("invalid mode")
            }
        }

        syncSizeLabels();
        initCanvas();
        setPhotoArtstyle(1);
        requestAnimationFrame(fitCanvasToShell);
    </script>
